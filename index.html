    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {

    } catch (e) {}

          ["6. From Idea to Initiative", "Partnership is one practical path. Many designs are proprietary, but limited resources can still be shared. IBM's foundry model lets competitors build on IBM's underused fabrication capacity, so both sides profit. Stakeholders should be identified and similar models explored to ease memory and chip prices in the mid to long term."],
          ["7. Design Thinking", "Reflect before solving: more research, industry collaboration, and other exercises come first (Estes, 2025, p. 25). The shortage is as much one of design and innovation thinking as one of product."],
          ["8. AI Reflection", "Dr. Gillespie used NotebookLM for research, found the first prompt weak, and refined it. He asked an AI assistant for one credible, independently verifiable source, then confirmed the Deloitte article himself. Claude helped identify that source and reviewed the paper against APA 7. Dr. Gillespie verified the source directly and approved every edit."],
          ["9. Leadership Lesson", "Dr. Gillespie has often relied on years of experience, seniority and influence to drive solutions without first stepping back to see the whole picture. He plans to practice the pause more and to encourage others to do the same."],
          ["10. Conclusion", "Starting with a solution may not be the best path. Removing barriers to communication and organizing ideas first should come before acting."]
        ],
        refs: [
          "Estes, R. (2025). <i>Design thinking: A guide to innovation</i>. Twenty-First Century Books.",
          "Kusters, J., Bhattacharjee, D., Ramachandran, K., & Stewart, D. (2026, July 28). Why memory chip crunch is greater than expected. <i>Deloitte Insights</i>.",
          "Tidd, J., & Bessant, J. (2025). <i>Managing innovation: Integrating technological, market and organizational change</i> (8th ed.). Wiley."
        ]
      }
    ];

    function casesHTML() {
      const arts = D.cases.map(c => `
        <article class="jr-art">
          <div class="jr-type">${esc(c.type)} · ${esc(c.course)} · ${esc(c.week)}</div>
          <h3 class="jr-title">${esc(c.title)}</h3>
          <p class="jr-by">Dr. Seth Gillespie</p>
          <p class="jr-aff">Amberton University · ${esc(c.prof)} · ${esc(c.date)}</p>
          <div class="jr-abs"><b>Abstract.</b>${esc(c.abstract)}</div>
          <p class="jr-kw"><b>Keywords:</b> ${esc(c.keywords)}</p>
          <details class="disclose">
            <summary class="disclose-sum"><span>Read the full article</span><span class="disclose-chev" aria-hidden="true">⌄</span></summary>
            <div class="disclose-body">
              <div class="jr-body">
                ${c.sections.map(s => `<h4>${esc(s[0])}</h4><p>${esc(s[1])}</p>`).join("")}
              </div>
              <div class="jr-refs"><strong>References</strong>${c.refs.map(r => `<p>${r}</p>`).join("")}</div>
            </div>
          </details>
        </article>`).join("");
      return `
      <section class="block" id="journal"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">📓 Journal</div>
          <h2 class="sec-title">Coursework, published like a journal.</h2>
          <p class="sec-sub">Each paper from the program gets the journal treatment, one issue per term. Newest at the bottom.</p>
        </div>
        <div class="jr-banner"><span>The Applied AI Casebook</span><span>Vol. 1 · Fall 2026</span><span>Amberton University</span></div>
        ${arts}
        <div class="jr-soon">In the next issues: more Fall 2026 papers, and a final capstone case study at the end of the degree.</div>
      </div></section>`;
    }

    function render() {
      document.body.insertAdjacentHTML("afterbegin", navHTML());
      const app = document.getElementById("app");
      app.innerHTML =
        heroHTML() +
        overviewHTML() +
        curriculumHTML() +
        casesHTML() +
        certHTML() +
        skillsMatrixHTML() +
        valueHTML() +
        careersHTML() +
        costHTML() +
        `<footer class="foot"><div class="wrap">
          Data sourced from the <a href="${D.meta.sourceUrl}" target="_blank" rel="noopener">Amberton University program page ↗</a>. <a href="${D.meta.repoUrl}" target="_blank" rel="noopener">View on GitHub ↗</a> <span class="ver">${esc(D.meta.version)}</span>
        </div></footer>`;

      wireTheme();
      // Journal lives in its own tab: #journal shows only the journal, anything else shows the program page.
      function route() {
        const hash = location.hash || "";
        const j = hash === "#journal";
        document.body.classList.toggle("view-journal", j);
        document.querySelectorAll(".nav-links a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === (j ? "#journal" : hash)));
        if (j) { window.scrollTo(0, 0); }
        else if (hash) { const t = document.querySelector(hash); if (t) t.scrollIntoView(); }
      }
      window.addEventListener("hashchange", route);
      route();
      // Chart.js may arrive late (slow CDN / proxied network on GitHub Pages).
      // Poll for it instead of relying on a single load event that may have already fired.
      (function waitForChart(tries) {
        if (window.Chart) { buildCharts(); return; }
        if (tries <= 0) return; // give up after ~10s; titles/captions still render
        setTimeout(() => waitForChart(tries - 1), 200);
      })(50);
    }

    // Expand/collapse a course card's competency detail.
    function toggleCourse(btn) {
      const panel = document.getElementById(btn.getAttribute("aria-controls"));
      if (!panel) return;
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!open));
      panel.hidden = open;
      btn.classList.toggle("open", !open);
    }
    window.toggleCourse = toggleCourse;

    function wireTheme() {
      const btn = document.getElementById("themeBtn");
      if (!btn) return;
      btn.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = cur === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch(e){}
        if (window.Chart) buildCharts(); // re-theme charts
      });
    }

    let _charts = [];
    function buildCharts() {
      _charts.forEach(c => c.destroy()); _charts = [];
      const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
      const ink = css("--text-primary"), sub = css("--text-secondary"), grid = css("--border-secondary");
      const accent = css("--accent"), accent2 = css("--accent-2"), accent3 = css("--accent-3"), accent4 = css("--accent-4");
      // Canvas can't parse color-mix(); derive translucent fills from hex tokens.
      const alpha = (hex, a) => { const m = /^#([0-9a-f]{6})$/i.exec(hex); if (!m) return hex;
        const n = parseInt(m[1], 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
      Chart.defaults.font.family = "system-ui, sans-serif";
      Chart.defaults.color = sub;
      const mk = (id, cfg) => { const el = document.getElementById(id); if (el) _charts.push(new Chart(el, cfg)); };

      mk("chartReadiness", {
        type:"line",
        data:{ labels: VALUE.readiness.labels, datasets:[{ label:"AI-readiness", data: VALUE.readiness.values,
          borderColor: accent, backgroundColor: alpha(accent, .15), fill:true, tension:.35, pointRadius:3, borderWidth:2 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>"Readiness index: "+c.raw}}},
          scales:{ x:{grid:{color:grid}}, y:{grid:{color:grid}, min:0, max:100, ticks:{callback:v=>v}} } }
      });

      mk("chartImpact", {
        type:"bar",
        data:{ labels: VALUE.impact.labels, datasets:[{ data: VALUE.impact.values,
          backgroundColor:[accent,accent2,accent3,accent4,"#FF6482"], borderRadius:8, borderWidth:0 }]},
        options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>"Impact index: "+c.raw}}},
          scales:{ x:{grid:{color:grid}, min:0, max:100}, y:{grid:{display:false}, ticks:{font:{size:11}}} } }
      });

      mk("chartFunctions", {
        type:"bar",
        data:{ labels: VALUE.functions.labels, datasets:[{ data: VALUE.functions.values,
          backgroundColor: accent2, borderRadius:8, borderWidth:0 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>"Improvement index: "+c.raw}}},
          scales:{ x:{grid:{display:false}, ticks:{maxRotation:30, minRotation:0, font:{size:10}}},
            y:{grid:{color:grid}, min:0, max:100} } }
      });

      mk("chartAdoption", {
        type:"doughnut",
        data:{ labels: VALUE.adoption.labels, datasets:[{ data: VALUE.adoption.values,
          backgroundColor:[accent, accent2, grid], borderWidth:0 }]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:"62%",
          plugins:{legend:{position:"bottom", labels:{padding:14, boxWidth:12, font:{size:11}}},
            tooltip:{callbacks:{label:c=>c.label+": "+c.raw+"%"}}} }
      });
    }

    render();


  </script>
</body>
</html>
