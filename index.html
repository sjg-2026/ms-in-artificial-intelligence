  // Pre-paint theme: respect OS preference unless user toggles in-session.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');

    } catch (e) {}

        { ico:"🎓", num: D.meta.creditHours, lab:"Credits I'll Earn" },
        { ico:"📚", num: numCourses, lab:"Milestones Along the Way" },
        { ico:"🗓️", num: D.meta.courseLengthWeeks + " wk", lab:"Per Class • "+D.meta.sessionsPerYear+" Terms/Year" },
        { ico:"⏳", num: completion, lab:"The Road Ahead" },
        { ico:"📈", num: progressPct + "%", lab:"Completed & In Progress", sub: completedCredits+" cr done · "+inProgressCredits+" cr in progress", hero:true }
      ];
      return `
      <section class="block" id="overview"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">📋 Program Overview</div>
          <h2 class="sec-title">A graduate degree for AI leaders, not bystanders.</h2>
          <p class="sec-sub">I've chosen to invest in myself — and in everyone who'll benefit from who I become. Here's the shape of the commitment ahead.</p>
        </div>
        <div class="kpi-grid">
          ${kpis.map(k => `<div class="kpi${k.hero ? " kpi-hero" : ""}"><div class="ico">${k.ico}</div><div class="num${k.hero ? " big" : ""}">${esc(k.num)}</div><div class="lab">${esc(k.lab)}</div>${k.sub ? `<div class="ksub">${esc(k.sub)}</div>` : ""}</div>`).join("")}
        </div>
        <div class="grid-2" style="margin-top:24px;">
          <div class="card">
            <h3 style="margin:0 0 14px; font-size:18px;">Who chooses this path</h3>
            <ul class="clean">${D.audience.map(a => `<li><span class="tick">→</span><span>${esc(a)}</span></li>`).join("")}</ul>
          </div>
          <div class="card">
            <h3 style="margin:0 0 14px; font-size:18px;">Who I'll become</h3>
            <ul class="clean">${D.outcomes.map(o => `<li><span class="tick">✓</span><span>${esc(o)}</span></li>`).join("")}</ul>
          </div>
        </div>
      </div></section>`;
    }

    function courseCard(c, idx) {
      const g = D.groups[c.group];
      const tags = c.skills.map(id => `<span class="ctag">${esc(skillById[id].label)}</span>`).join("");
      const hasDetail = Array.isArray(c.competencies) && c.competencies.length;
      const cid = "course-" + c.code;
      let expand = "";
      if (hasDetail) {
        const items = c.competencies.map(t => `<li>${esc(t)}</li>`).join("");
        const link = c.url ? `<a class="course-link" href="${c.url}" target="_blank" rel="noopener">View official course page ↗</a>` : "";
        expand = `
          <button class="course-toggle" aria-expanded="false" aria-controls="${cid}" onclick="toggleCourse(this)">
            <span class="ct-label">The strengths I'll carry forward</span>
            <span class="ct-chev" aria-hidden="true">⌄</span>
          </button>
          <div class="course-detail" id="${cid}" hidden>
            <ul class="comp-list">${items}</ul>
            ${link}
          </div>`;
      }
      const done = c.status === "completed";
      const inProgress = c.status === "inProgress";
      const statusBadge = done
        ? `<div class="badge-done"><span class="tick" aria-hidden="true">✓</span> Completed${c.completedVia ? " · " + esc(c.completedVia) : ""}</div>`
        : inProgress
        ? `<div class="badge-progress"><span class="tick" aria-hidden="true">●</span> In progress</div>`
        : "";
      const seqLabel = c.term ? esc(c.term) : "term " + c.seq;
      return `<div class="course${done ? " is-done" : ""}${inProgress ? " is-progress" : ""}" style="--g-color:${g.color}">
        <span class="seqbadge">${seqLabel}</span>
        <div class="code">${esc(c.code)} · ${c.credits} cr</div>
        ${statusBadge}
        <div class="ctitle">${esc(c.title)}</div>
        <p class="cnote">${esc(c.note||"")}</p>
        <div class="ctags">${tags}</div>
        ${expand}
      </div>`;
    }

    function curriculumHTML() {
      const order = ["required","core","elective"];
      const tracks = order.map(gk => {
        const g = D.groups[gk];
        const cs = D.courses.filter(c => c.group === gk);
        const extra = gk === "elective" ? `<div class="note-bar">${esc(D.electiveRule)} <a href="https://amberton.edu/course-guide/" target="_blank" rel="noopener">Browse the course guide ↗</a></div>` : "";
        return `<div class="track">
          <div class="track-head">
            <span class="bar" style="background:${g.color}"></span>
            <h3>${esc(g.label)}</h3>
            <span class="hrs">${g.hrs} credit hours</span>
            <span class="blurb">${esc(g.blurb)}</span>
          </div>
          <div class="course-grid">${cs.map(courseCard).join("")}</div>
          ${extra}
        </div>`;
      }).join("");

      const legend = [1,2,3,4].map(n => `<div class="step"><span class="dotn">${n}</span> ${["Set out","Build momentum","Deepen mastery","Lead the way"][n-1]}</div>`).join("");

      return `
      <section class="block" id="curriculum"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">🗺️ Curriculum Map</div>
          <h2 class="sec-title">36 credits, sequenced from foundations to leadership.</h2>
          <p class="sec-sub">Each course is a milestone on the path — and a real investment of my time and focus. Open any one to see the strengths I'll carry forward.</p>
        </div>
        <div class="seq-legend">${legend}</div>
        ${tracks}
      </div></section>`;
    }

    function skillsMatrixHTML() {
      // count skill coverage per course for heat intensity (primary vs secondary)
      const heatColors = ["transparent", "color-mix(in srgb,var(--accent) 28%,transparent)", "color-mix(in srgb,var(--accent) 58%,transparent)", "var(--accent)"];
      const rows = D.courses.map(c => {
        const cells = D.skills.map(s => {
          let lvl = 0;
          if (c.skills.includes(s.id)) lvl = c.skills[0] === s.id ? 3 : 2;
          const bg = heatColors[lvl];
          const title = `${c.code} × ${s.label}: ${["none","","develops","core focus"][lvl]}`;
          const cellInner = `<div class="cell" style="background:${bg}" title="${esc(title)}"></div>`;
          const wrapped = c.url
            ? `<a href="${c.url}" target="_blank" rel="noopener" title="${esc(title)}" style="display:block;">${cellInner}</a>`
            : cellInner;
          return `<td>${wrapped}</td>`;
        }).join("");
        const codeCell = c.url
          ? `<a class="matrix-link" href="${c.url}" target="_blank" rel="noopener">${esc(c.code)} ↗</a>`
          : esc(c.code);
        const mstat = c.status === "completed"
          ? `<span class="m-stat done">✓ ${esc(c.completedVia ? "Transferred" : "Completed")}</span>`
          : c.status === "inProgress"
          ? `<span class="m-stat prog">● In progress</span>`
          : `<span class="m-stat plan">${esc(c.term || ("Term " + (c.seq || "")))}</span>`;
        return `<tr><th>${codeCell}<br><small>${esc(c.title)}</small><br>${mstat}</th>${cells}</tr>`;
      }).join("");

      const heads = D.skills.map(s => `<th>${esc(s.label)}</th>`).join("");

      return `
      <section class="block" id="skills"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">🧩 Skills & Competencies</div>
          <h2 class="sec-title">Every course maps to an in-demand AI skill.</h2>
          <p class="sec-sub">Every milestone I complete builds a real, lasting strength — the kind my team will feel long after the work is done. Darker means it's at the heart of that course.</p>
        </div>
        <div class="matrix-scroll">
          <table class="matrix">
            <thead><tr><th style="text-align:left;">Course</th>${heads}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="heat-legend">
          <span>Coverage:</span>
          <div class="heat-swatch">
            <span style="background:${heatColors[1]}"></span>
            <span style="background:${heatColors[2]}"></span>
            <span style="background:${heatColors[3]}"></span>
          </div>
          <span>builds it → at its heart</span>
        </div>
      </div></section>`;
    }

    function careersHTML() {
      return `
      <section class="block" id="careers"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">💼 Career Outcomes</div>
          <h2 class="sec-title">Roles this degree is built to unlock.</h2>
          <p class="sec-sub">Where this journey can lead — not just a title, but the chance to make a real difference for the people who count on me.</p>
        </div>
        <div class="career-grid">
          ${D.careers.map(c => `<div class="career"><div class="ci">${c.icon}</div><div class="cr">${esc(c.role)}</div><div class="cb">${esc(c.blurb)}</div></div>`).join("")}
        </div>
      </div></section>`;
    }

    function certHTML() {
      const cert = D.certificate;
      if (!cert) return "";
      const rows = cert.courses.map(code => {
        const c = courseByCode[code] || { code, title: "", credits: 3 };
        const done = c.status === "completed";
        const prog = c.status === "inProgress";
        const badge = done
          ? `<span class="badge-done"><span class="tick" aria-hidden="true">✓</span> Completed${c.completedVia ? " · " + esc(c.completedVia) : ""}</span>`
          : prog
          ? `<span class="badge-progress"><span class="tick" aria-hidden="true">●</span> In progress</span>`
          : `<span class="cert-planned">${esc(c.term || ("Term " + (c.seq||"")))}</span>`;
        const name = c.url
          ? `<a class="matrix-link" href="${c.url}" target="_blank" rel="noopener">${esc(c.code)} ↗</a>`
          : esc(c.code);
        return `<tr>
          <td class="cert-code">${name}</td>
          <td class="cert-title">${esc(c.title)}</td>
          <td class="cert-cr">${esc(c.credits)} hrs</td>
          <td class="cert-status">${badge}</td>
        </tr>`;
      }).join("");
      return `
      <section class="block" id="certificate"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">🎖️ Graduate Certificate</div>
          <h2 class="sec-title">A stackable credential I earn along the way.</h2>
          <p class="sec-sub">${esc(cert.name)} — ${esc(cert.hours)} credits. Every course it requires is already part of my degree plan, so this credential comes built into the journey.</p>
        </div>
        <div class="card">
          <p style="margin:0 0 18px; color:var(--text-secondary); font-size:15px; line-height:1.6;">${esc(cert.overview)}</p>
          <div class="matrix-scroll">
            <table class="matrix cert-table">
              <thead><tr><th style="text-align:left;">Course</th><th style="text-align:center;">Title</th><th>Credit</th><th>Status</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="note-bar" style="margin-top:18px;">${esc(cert.note)}</div>
          <p style="margin:14px 0 0; font-size:13px; color:var(--text-secondary);">
            ${esc(cert.footnote)}
            <a href="${cert.sourceUrl}" target="_blank" rel="noopener">View the official certificate sheet ↗</a>
          </p>
        </div>
      </div></section>`;
    }

    function valueHTML() {
      const strip = VALUE.headline.map(h => `
        <div class="stat-big">
          <div class="v">${esc(h.v)}</div>
          <div class="d">${esc(h.d)}</div>
          <div class="s">${h.url?`<a href="${h.url}" target="_blank" rel="noopener">${esc(h.s)} ↗</a>`:esc(h.s)}</div>
        </div>`).join("");

      const pillars = VALUE.pillars.map(p => `
        <div class="career">
          <div class="ci">${p.icon}</div>
          <div class="cr">${esc(p.title)}</div>
          <div class="cb">${esc(p.blurb)}</div>
        </div>`).join("");

      return `
      <section class="block" id="value"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">💡 Why It Matters</div>
          <h2 class="sec-title">My growth compounds into real value for the people I serve.</h2>
          <p class="sec-sub">The effort I'm choosing to give comes back as something real — sharper decisions, lighter loads, and a team that's ready for what's next. This is what my dedication makes possible.</p>
        </div>

        <div class="stat-strip">${strip}</div>

        <h3 style="font-size:20px; font-weight:600; margin:8px 0 18px;">Five ways my dedication creates real value</h3>
        <div class="career-grid" style="margin-bottom:32px;">${pillars}</div>

        <div class="chart-grid">
          <div class="chart-card">
            <h4>Organizational AI-readiness as leadership matures</h4>
            <p class="src">${esc(VALUE.readiness.src)}</p>
            <div class="chart-box"><canvas id="chartReadiness"></canvas></div>
          </div>
          <div class="chart-card">
            <h4>Organizational impact by leadership capability</h4>
            <p class="src">${esc(VALUE.impact.src)}</p>
            <div class="chart-box"><canvas id="chartImpact"></canvas></div>
          </div>
          <div class="chart-card">
            <h4>Where AI-fluent leaders drive improvement</h4>
            <p class="src">${esc(VALUE.functions.src)}</p>
            <div class="chart-box"><canvas id="chartFunctions"></canvas></div>
          </div>
          <div class="chart-card">
            <h4>Employer AI adoption</h4>
            <p class="src">${esc(VALUE.adoption.src)}</p>
            <div class="chart-box"><canvas id="chartAdoption"></canvas></div>
          </div>
        </div>

        <div class="card" style="margin-top:24px;">
          <h3 style="margin:0 0 4px; font-size:18px;">What my organization gains when I walk this path</h3>
          <p class="src" style="margin:0 0 16px;">How this applied, human-centered journey compares to the alternatives.</p>
          <div style="overflow-x:auto;">
          <table class="cmp">
            <thead><tr><th>Organizational priority</th><th>This program</th><th>Technical MS in AI/ML</th><th>Generic MBA</th></tr></thead>
            <tbody>
              <tr class="me"><td>Develops leaders who deploy AI</td><td class="hl">Built for it</td><td>Builds the systems, not the leaders</td><td>General management</td></tr>
              <tr><td>Applied to real business processes</td><td class="hl">Core focus</td><td>Research-oriented</td><td>Broad, not AI-specific</td></tr>
              <tr class="me"><td>Responsible-AI governance</td><td class="hl">Built in (RGS6036)</td><td>Sometimes</td><td>Rare</td></tr>
              <tr><td>Predictive analytics for decisions</td><td class="hl">Core (MGT6785)</td><td>Core</td><td>Limited</td></tr>
              <tr class="me"><td>Fits working professionals</td><td class="hl">100% online, 10-wk terms</td><td>Often on-campus</td><td>Mixed</td></tr>
              <tr><td>Best for the organization when…</td><td class="hl">Leading AI adoption</td><td>Building AI products</td><td>Broad upskilling</td></tr>
            </tbody>
          </table>
          </div>
        </div>
      </div></section>`;
    }

    /* ===== MOUNT ===== */
    function costHTML() {
      const perCredit = D.meta.costPerCredit || 325;
      const perClass = perCredit * 3;
      const total = perCredit * D.meta.creditHours;
      const cards = [
        { ico:"💵", num: "$" + perCredit, lab:"Per Credit Hour" },
        { ico:"📖", num: "< $1,000", lab:"Per Class · 3 credit hours" },
        { ico:"🎓", num: "$" + total.toLocaleString(), lab:"Est. Total Tuition · " + D.meta.creditHours + " credits" }
      ];
      return `
      <section class="block" id="cost"><div class="wrap">
        <div class="sec-head">
          <div class="sec-kicker">💰 Cost</div>
          <h2 class="sec-title">Accessible, transparent tuition — under $1,000 per class.</h2>
          <p class="sec-sub">A flat per-credit rate with no hidden fees, so I can plan my investment one class at a time.</p>
        </div>
        <details class="disclose">
          <summary class="disclose-sum">
            <span>Show tuition details</span>
            <span class="disclose-chev" aria-hidden="true">⌄</span>
          </summary>
          <div class="disclose-body">
            <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
              ${cards.map(c => `<div class="kpi"><div class="ico">${c.ico}</div><div class="num">${esc(c.num)}</div><div class="lab">${esc(c.lab)}</div></div>`).join("")}
            </div>
            <div class="note-bar">Tuition figures from the official Amberton program page ($${perCredit}/credit). A 3-credit course is $${perClass.toLocaleString()} — under $1,000 per class.</div>
          </div>
        </details>
      </div></section>`;
    }

    /* ===== MOUNT ===== */
    function render() {
      document.body.insertAdjacentHTML("afterbegin", navHTML());
      const app = document.getElementById("app");
      app.innerHTML =
        heroHTML() +
        overviewHTML() +
        curriculumHTML() +
        certHTML() +
        skillsMatrixHTML() +
        valueHTML() +
        careersHTML() +
        costHTML() +
        `<footer class="foot"><div class="wrap">
          Data sourced from the <a href="${D.meta.sourceUrl}" target="_blank" rel="noopener">Amberton University program page ↗</a>. <a href="${D.meta.repoUrl}" target="_blank" rel="noopener">View on GitHub ↗</a> <span class="ver">${esc(D.meta.version)}</span>
        </div></footer>`;

      wireTheme();
      // Chart.js may arrive late (slow CDN / proxied network on GitHub Pages).
      // Poll for it instead of relying on a single load event that may have already fired.
      (function waitForChart(tries) {
        if (window.Chart) { buildCharts(); return; }
        if (tries <= 0) return; // give up after ~10s; titles/captions still render
        setTimeout(() => waitForChart(tries - 1), 200);
      })(50);
    }

    // Expand/collapse a course card's competency detail.
    function toggleCourse(btn) {
      const panel = document.getElementById(btn.getAttribute("aria-controls"));
      if (!panel) return;
      const open = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!open));
      panel.hidden = open;
      btn.classList.toggle("open", !open);
    }
    window.toggleCourse = toggleCourse;

    function wireTheme() {
      const btn = document.getElementById("themeBtn");
      if (!btn) return;
      btn.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = cur === "light" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch(e){}
        if (window.Chart) buildCharts(); // re-theme charts
      });
    }

    let _charts = [];
    function buildCharts() {
      _charts.forEach(c => c.destroy()); _charts = [];
      const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
      const ink = css("--text-primary"), sub = css("--text-secondary"), grid = css("--border-secondary");
      const accent = "#6E5BE6", accent2 = "#2997FF", accent3 = "#30D158", accent4 = "#FF9F0A";
      Chart.defaults.font.family = "system-ui, sans-serif";
      Chart.defaults.color = sub;
      const mk = (id, cfg) => { const el = document.getElementById(id); if (el) _charts.push(new Chart(el, cfg)); };

      mk("chartReadiness", {
        type:"line",
        data:{ labels: VALUE.readiness.labels, datasets:[{ label:"AI-readiness", data: VALUE.readiness.values,
          borderColor: accent, backgroundColor:"rgba(110,91,230,.15)", fill:true, tension:.35, pointRadius:3, borderWidth:2 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>"Readiness index: "+c.raw}}},
          scales:{ x:{grid:{color:grid}}, y:{grid:{color:grid}, min:0, max:100, ticks:{callback:v=>v}} } }
      });

      mk("chartImpact", {
        type:"bar",
        data:{ labels: VALUE.impact.labels, datasets:[{ data: VALUE.impact.values,
          backgroundColor:[accent,accent2,accent3,accent4,"#FF6482"], borderRadius:8, borderWidth:0 }]},
        options:{ indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>"Impact index: "+c.raw}}},
          scales:{ x:{grid:{color:grid}, min:0, max:100}, y:{grid:{display:false}, ticks:{font:{size:11}}} } }
      });

      mk("chartFunctions", {
        type:"bar",
        data:{ labels: VALUE.functions.labels, datasets:[{ data: VALUE.functions.values,
          backgroundColor: accent2, borderRadius:8, borderWidth:0 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>"Improvement index: "+c.raw}}},
          scales:{ x:{grid:{display:false}, ticks:{maxRotation:30, minRotation:0, font:{size:10}}},
            y:{grid:{color:grid}, min:0, max:100} } }
      });

      mk("chartAdoption", {
        type:"doughnut",
        data:{ labels: VALUE.adoption.labels, datasets:[{ data: VALUE.adoption.values,
          backgroundColor:[accent, accent2, grid], borderWidth:0 }]},
        options:{ responsive:true, maintainAspectRatio:false, cutout:"62%",
          plugins:{legend:{position:"bottom", labels:{padding:14, boxWidth:12, font:{size:11}}},
            tooltip:{callbacks:{label:c=>c.label+": "+c.raw+"%"}}} }
      });
    }

    render();


  </script>
</body>
</html>
