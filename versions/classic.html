<!doctype html>

<title>MS in Applied AI · Classic</title>
<style>
:root{--bg:#fff;--alt:#f4f6fa;--text:#1b2230;--mut:#5b6577;--line:#dde2ea;--brand:#0b3d91;--brand2:#1a5fd0;--ok:#1f8a4c;--prog:#b86e00;--pend:#6b4fd3}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--alt:#171c27;--text:#e8ecf4;--mut:#9aa5ba;--line:#2a3243;--brand:#7fb0ff;--brand2:#9cc2ff;--ok:#4cc582;--prog:#f0a63a;--pend:#a995ff}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text)}
h1,h2,h3,nav,.sans,th,.badge,button{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
a{color:var(--brand2)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{font:700 15px/1.2 -apple-system,'Segoe UI',sans-serif;color:var(--brand)}
nav a{margin-left:16px;font-size:14px;text-decoration:none;color:var(--mut)}nav a:hover{color:var(--brand2)}
.hero{background:var(--alt);padding:48px 0 36px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:0 0 12px;color:var(--brand)}
.hero p{max-width:760px;margin:0 0 18px;color:var(--mut);font-size:18px}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;display:flex;margin:18px 0 8px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:13px -apple-system,sans-serif;color:var(--mut)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi b{display:block;font:700 28px/1.1 -apple-system,sans-serif;color:var(--brand)}
.kpi span{font:13px -apple-system,sans-serif;color:var(--mut)}
section{padding:44px 0;border-bottom:1px solid var(--line)}
section h2{font-size:28px;margin:0 0 6px;color:var(--brand)}
section>.wrap>p.sub{margin:0 0 22px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.c{white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.b-completed{color:var(--ok)}.b-inProgress{color:var(--prog)}.b-pending{color:var(--pend)}
.grp{margin:26px 0 8px;font:700 13px -apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--bg)}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0;color:var(--mut);font-size:14px}
details.paper{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;background:var(--bg)}
details.paper>summary{cursor:pointer;padding:14px 16px;list-style:none;font-family:-apple-system,sans-serif}
details.paper>summary::-webkit-details-marker{display:none}
details.paper>summary b{display:block;font-size:17px;color:var(--brand)}
details.paper>summary small{color:var(--mut)}
.paper .body{padding:0 18px 18px;border-top:1px solid var(--line)}
.paper h4{margin:16px 0 2px;font:700 14px -apple-system,sans-serif}
.paper p{margin:0 0 6px;font-size:15px}
.paper .refs{font-size:13px;color:var(--mut);margin-top:14px}
footer{padding:28px 0;color:var(--mut);font:13px -apple-system,sans-serif}
@media (max-width:640px){nav{display:none}.hero{padding-top:30px}th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>

<script>
const DATA={"meta": {"name": "Master of Science in Applied Artificial Intelligence", "school": "Amberton University", "format": "100% Online", "creditHours": 36, "costPerCredit": 325, "courseLengthWeeks": 10, "sessionsPerYear": 4, "sourceUrl": "https://amberton.edu/degree-programs/master-of-science-applied-artificial-intelligence", "version": "v7", "repoUrl": "https://github.com/sjg-2026/ms-in-artificial-intelligence"}, "mission": "Amberton's MS in Applied AI is built for working professionals. It pairs theory with hands-on practice, including Amberton's AI testing environments, so graduates can lead AI adoption instead of watching it happen.", "audience": ["Working professionals who want to keep growing", "Leaders willing to give up evenings and weekends", "People who want the work to matter to their team", "Learners balancing work, life, and school"], "outcomes": ["Bring AI solutions back to the people who rely on him", "Lead AI adoption with good judgment and integrity", "Push for ethical, responsible AI in his organization", "Turn analytical skill into better decisions for his team", "Be the person colleagues come to as AI changes the work"], "skills": [{"id": "strategy", "label": "AI Strategy & Innovation", "color": "var(--accent)"}, {"id": "analytics", "label": "Applied & Predictive Analytics", "color": "var(--accent-2)"}, {"id": "mlfound", "label": "ML / AI Foundations", "color": "var(--accent-3)"}, {"id": "ethics", "label": "Ethical & Responsible AI", "color": "var(--accent-4)"}, {"id": "leader", "label": "Leadership & Communication", "color": "#FF6482"}, {"id": "research", "label": "Research & Decision Methods", "color": "#64D2FF"}], "courses": [{"code": "RGS6035", "title": "Theory and Application of Research Methods", "group": "required", "credits": 3, "seq": 1, "skills": ["research", "analytics"], "note": "Foundation in evidence-based inquiry.", "status": "completed", "completedVia": "Transfer credit", "term": "Transferred", "url": "https://amberton.edu/courses/theory-and-application-of-research-methods/"}, {"code": "RGS6036", "title": "Ethics for Decision Making", "group": "required", "credits": 3, "seq": 1, "skills": ["ethics", "leader"], "note": "Ethical reasoning for organizational decisions.", "status": "completed", "term": "Summer 2026", "url": "https://amberton.edu/courses/ethics-for-decision-making/"}, {"code": "MGT5765", "title": "Artificial Intelligence Essentials", "group": "core", "credits": 3, "seq": 1, "skills": ["mlfound", "strategy"], "note": "Core AI concepts and capabilities.", "status": "pending", "term": "Winter 2027", "dates": "12/05/2026 – 02/25/2027", "enroll": "Enrollment opens 11/01/2026 · finalize by ~12/03/2026 (est.)", "url": "https://amberton.edu/courses/mgt5765-artificial-intelligence-essentials/"}, {"code": "MGT5710", "title": "Applied AI for Business", "group": "core", "credits": 3, "seq": 2, "skills": ["strategy", "mlfound", "analytics"], "note": "Translating AI into business value.", "status": "inProgress", "almost": true, "term": "2026 - Fall - Current", "url": "https://amberton.edu/courses/mgt5710-applied-artificial-intelligence-for-business/"}, {"code": "MGT6460", "title": "Applied Business Analytics", "group": "core", "credits": 3, "seq": 2, "skills": ["analytics", "research"], "note": "Data-driven business analysis.", "status": "completed", "term": "Summer 2026", "url": "https://amberton.edu/courses/applied-business-analytics/"}, {"code": "MGT6785", "title": "Applied Predictive Analytics", "group": "core", "credits": 3, "seq": 3, "skills": ["analytics", "mlfound"], "note": "Forecasting and predictive modeling.", "status": "pending", "term": "Spring 2027", "dates": "Dates not yet published", "enroll": "Est. enrollment opens ~02/01–02/07/2027 · finalize by ~03/11/2027", "url": "https://amberton.edu/courses/mgt6785-applied-predictive-analytics/"}, {"code": "MGT5790", "title": "AI Driven Innovation and Strategy", "group": "core", "credits": 3, "seq": 3, "skills": ["strategy", "leader"], "note": "Innovation strategy in AI-led markets.", "status": "inProgress", "almost": true, "term": "2026 - Fall - Current", "url": "https://amberton.edu/courses/mgt5790-ai-driven-innovation-strategy/"}, {"code": "COM5469", "title": "Leadership Communication", "group": "core", "credits": 3, "seq": 4, "skills": ["leader"], "note": "Leading and communicating change.", "status": "completed", "term": "Summer 2026", "url": "https://amberton.edu/courses/com5469-leadership-communication/"}, {"code": "MGT6705", "title": "Strategic Innovation & Leadership", "group": "elective", "credits": 3, "seq": 4, "skills": ["strategy", "leader"], "note": "Leading innovation and turning ideas into impact.", "status": "inProgress", "almost": true, "term": "2026 - Fall - Current", "url": "https://amberton.edu/courses/innovation/"}, {"code": "MKT6210", "title": "Marketing Management", "group": "elective", "credits": 3, "seq": 4, "skills": ["strategy", "analytics"], "note": "Strategic, data-driven marketing management.", "status": "completed", "completedVia": "Transfer credit", "term": "Transferred", "url": "https://amberton.edu/courses/marketing-management/"}, {"code": "MGT5203", "title": "Operations Management", "group": "elective", "credits": 3, "seq": 4, "skills": ["analytics", "strategy"], "note": "Operations, supply chain, and process excellence.", "status": "completed", "completedVia": "Transfer credit", "term": "Transferred", "url": "https://amberton.edu/courses/operations-management-2/"}, {"code": "ECO6140", "title": "Managerial Economics", "group": "elective", "credits": 3, "seq": 4, "skills": ["analytics", "research"], "note": "Economic analysis for managerial decisions.", "status": "completed", "completedVia": "Transfer credit", "term": "Transferred", "url": "https://amberton.edu/courses/managerial-economics/"}], "groups": {"required": {"label": "Required Graduate Studies", "hrs": 6, "blurb": "The foundation: research methods and ethics.", "color": "var(--accent-3)"}, "core": {"label": "Major Requirements", "hrs": 18, "blurb": "The core: AI, analytics, and leading change.", "color": "var(--accent)"}, "elective": {"label": "Electives", "hrs": 12, "blurb": "Electives Dr. Gillespie picked to fit his work.", "color": "var(--accent-2)"}}, "careers": [{"role": "Agentic AI Engineer", "icon": "🤖", "blurb": "Build agents that plan, reason, and act on their own."}, {"role": "Machine Learning Engineer", "icon": "🧠", "blurb": "Build, train, and ship models to production."}, {"role": "MLOps / AI Platform Engineer", "icon": "⚙️", "blurb": "Automate the pipelines, deployment, and monitoring that keep AI running."}, {"role": "Data Engineer", "icon": "🗄️", "blurb": "Build the data foundations every model depends on."}, {"role": "Applied AI / LLM Engineer", "icon": "🚀", "blurb": "Fine-tune, evaluate, and integrate LLMs into real products."}], "certificate": {"name": "Graduate Certificate in Applied Artificial Intelligence (AI)", "hours": 12, "overview": "The Graduate Certificate in Applied Artificial Intelligence is ideal for Amberton students who desire to enhance their personal and workplace influence. The curriculum focuses on the fundamental skills necessary to understand and convey the appropriate use of artificial intelligence (AI) in professional environments. This certificate enables the student to display professionalism, emotional intelligence, and other career-building skills — including communication, team building, time management, conflict resolution, adaptability, critical thinking, work ethic, problem-solving, and leadership.", "courses": ["MGT5710", "MGT5765", "MGT5790", "COM5469"], "note": "No graduate credit will be awarded if MGT5710, MGT5765, MGT5790, or COM5469 have already been successfully completed.", "footnote": "Can be earned as a stand-alone certificate of study or in conjunction with a degree program.", "sourceUrl": "https://amberton.edu/wp-content/uploads/2025/09/APPLIED-ARTIFICIAL-INTELLIGENCE-GRADUATE-2025-II.pdf"}, "cases": [{"type": "Case Study", "course": "MGT 6705 · Strategic Innovation & Leadership", "week": "Week 2", "date": "09/27/2026", "prof": "Dr. Ron C. Darnell", "title": "Innovation Models and Types Analysis: The Apple iPhone", "abstract": "The iPhone was not the first smartphone, yet it reshaped the market. This case study runs the 2007 launch through Tidd and Bessant's 4 Ps of innovation and the Five Whys from design thinking, then looks at its disruptive potential and the managed process behind it. Dr. Gillespie draws the lesson that innovation survives any one leader because it can be run as a process.", "keywords": "iPhone, 4 Ps of innovation, disruptive innovation, Five Whys, stealth innovation", "sections": [["1. Introduction", "Apple introduced the iPhone in January 2007 without being first to market. Tidd and Bessant (2025) treat innovation as a core business process, not a spontaneous event, and Goffin and Mitchell (2025) tie it to strategic intent. Apple's earlier wins with the iPod and its computers may have given leadership the confidence to make a bold move."], ["2. The Innovation", "A touch-only experience with no keyboard, full web browsing, and an operating system that let users install apps. The App Store was not there at launch, but hundreds of apps arrived within a year. Apple's (2024) filings show iPhone sales in the hundreds of billions of dollars, with services alone nearing $100 billion."], ["3. Type of Innovation", "Through the 4 Ps: the multi-touch interface was a product innovation; designing its own processor, operating system and experience was a process innovation; a higher-priced consumer device sold to business buyers was a positional innovation; and the revenue-sharing App Store ecosystem was a paradigm shift, arguably a radical one."], ["4. Value Creation", "Using Estes's (2025) Five Whys, Dr. Gillespie asks: can one device replace a phone, a camera, a music player, and the app store people once visited on a laptop? Simplicity, and choices like skipping the stylus, delivered the customer value. Was the risk worth it for Apple, after failures like the Lisa? Today the iPhone generates about half of Apple's revenue and created a services arm. Would it matter to the industry? The app economy behind Uber, Instagram and mobile banking says yes. And Apple accepted self-cannibalization of the iPod and iPad. This is the discontinuous innovation Tidd and Bessant describe."], ["5. Disruptive Potential", "In the terms of Christensen's disruptive innovation, which Tidd and Bessant (2025, p. 232) cite, the iPhone disrupted standalone phone makers, MP3 players, digital cameras and GPS devices. It launched at a much higher price than typical consumer devices, which the advanced materials and technology required."], ["6. Innovation as a Managed Process", "Goffin and Mitchell (2025) point to ideation, teams, planning and early-stage decisions. Apple prototypes in secret, the “stealth innovation” they describe. Planning let outcomes be judged, and early-stage decisions likely shaped the radical design."], ["7. AI Reflection", "Dr. Gillespie used Claude Code for research, brainstorming and APA 7 checks, then reviewed, revised and expanded the output with his own analysis and the provided citations. Grammarly checked sentence structure and spelling."], ["8. Leadership Lesson", "Dr. Gillespie draws inspiration from the people who built the product. The takeaway: innovation is not tied to one company, and after Steve Jobs it clearly does not depend on one leader. It can be managed as a process."], ["9. Conclusion", "The iPhone is a model case in innovation. The question it leaves: which functions could be combined into a single product or tool?"]], "refs": ["Anthropic. (2026). <i>Claude Code<\/i> [Large language model]. https://www.anthropic.com", "Apple Inc. (2024). <i>Form 10-K for the fiscal year ended September 28, 2024<\/i>. U.S. Securities and Exchange Commission.", "Estes, R. (2025). <i>Design thinking: A guide to innovation<\/i>. Twenty-First Century Books.", "Goffin, K., & Mitchell, R. (2025). <i>Innovation management: Effective strategy and implementation<\/i> (4th ed.). Bloomsbury Academic.", "Grammarly. (2026). <i>Grammarly<\/i> [Writing assistant]. https://www.grammarly.com", "Tidd, J., & Bessant, J. (2025). <i>Managing innovation: Integrating technological, market and organizational change<\/i> (8th ed.). Wiley."]}, {"type": "Paper", "course": "MGT 5710 · Applied AI for Business", "week": "Week 3", "date": "10/04/2026", "prof": "Dr. John Sinclair", "title": "AI Applications in Information Technology and Program Management", "abstract": "Enterprise IT produces millions of logs and alerts a day, more than people can read. This paper examines two applications of AI: generative and predictive AI for incident management, and agentic tools for program management and service delivery. It weighs the opportunities against the human challenges of adoption and argues that leaders need a disciplined business case, not novelty.", "keywords": "incident management, generative AI, agentic AI, program management, adoption", "sections": [["1. Introduction", "AI is increasingly the tool of choice for taming IT-scale data. Yao and Koidan (2024) single out generative AI for its business applicability, and Marr (2025) notes its growing role in detecting threats such as spam and breaches."], ["2. Incident Management", "Generative AI can write plain-language log summaries, correlate related alerts into one incident, suggest probable causes and draft remediation steps. In Dr. Gillespie's experience, the hard part of a major incident is not collecting information but making sense of it and building an actionable story. Pairing generative AI with predictive AI covers both ends: anticipating incidents and resolving current escalations fast."], ["3. Program Management and Service Delivery", "Project managers traditionally build plans, Gantt charts and reports by hand. Agentic tools such as Claude Code let managers and engineers delegate programming, configuration and documentation to an agent, compressing hours or days into minutes, and can produce stakeholder dashboards just as quickly."], ["4. Opportunities", "The opportunity is to advocate for AI inside an organization, despite early concerns about privacy and security. Gains include efficiency, productivity and customer satisfaction: faster root-cause analysis shortens outages and eases alert fatigue, and automated reports free project managers for risk management and stakeholder work. Business cases presented to senior management are how adoption starts."], ["5. Challenges", "Without clear objectives and risk responses, adoption stalls. Estes (2025) stresses the empathize phase: frame the problem around real human needs and feelings. Some people fear for their jobs or have been burned by hallucinated reports. Those human factors belong in the business case."], ["6. Conclusion", "IT and business leaders should advocate for AI ethically and productively, with a disciplined assessment and a real business benefit behind each tool. Incident management has the clearest case; program management tooling benefits project managers directly."], ["7. AI Use Disclosure", "Dr. Gillespie used Claude Code to organize research and draft portions, and Grammarly for grammar and clarity. He reviewed, revised and verified all content and takes responsibility for the final work."]], "refs": ["Anthropic. (2026). <i>Claude Code<\/i> [Large language model]. https://www.anthropic.com", "Estes, R. (2025). <i>Design thinking: A guide to innovation<\/i>. Twenty-First Century Books.", "Grammarly. (2026). <i>Grammarly<\/i> [Writing assistant]. https://www.grammarly.com", "Marr, B. (2025). <i>AI strategy: Unleash the power of artificial intelligence in your business<\/i>. Kogan Page.", "Yao, M., & Koidan, K. (2024). <i>Applied artificial intelligence: A handbook for business leaders<\/i> (2nd ed.). TOPBOTS."]}, {"type": "Presentation", "course": "MGT 5710 · Applied AI for Business", "week": "Week 3", "date": "10/04/2026", "prof": "Dr. John Sinclair", "title": "Automating the Out-of-Office: An AI Absence Bot", "abstract": "A conversational bot that records an employee's absence and sets the email auto-reply with the manager as backup, built in BoodleBox's Vibe Bot Builder Lite on GPT-5 mini. Dr. Gillespie tested it, found where it needed guardrails, and took away a design lesson: collect every field up front with a structured request.", "keywords": "chatbot, process automation, BoodleBox, privacy, structured requests", "sections": [["1. What Was Built", "A four-step flow. The employee reports sick, vacation or jury duty; the bot captures start and end dates and times; a directory lookup verifies the manager as backup; the out-of-office reply is posted in Google Workspace. Marr (2025) calls intelligent chatbots one of the most common ways companies will deploy AI."], ["2. Test 1", "Given a plain-language request, the bot captured name, absence type and start date, then asked five follow-up questions."], ["3. Why This Process", "It is a small task people forget at the worst moment. It is frequent and rule-based, time-sensitive when sick days start without warning, and visible when missed. Clear data sources and a narrow scope make it a low-risk first AI project."], ["4. Benefits", "Key details from one plain sentence, follow-up questions instead of guesses, and a consistent formal reply that names a backup contact."], ["5. Risks", "Privacy: the Test 1 draft said “sick leave,” so neutral wording is needed. The manager lookup failed in Test 1, so the directory must be connected. Mailbox access calls for least privilege and audit logs."], ["6. Future Potential", "Sync leave balances with HR and payroll, block calendars and update chat status, and alert the manager with coverage suggestions."], ["7. Lesson Learned", "Test 1 needed five follow-ups. A structured request template in the bot (reason, start, end, manager, auto-apply, reply scope) would collect every field up front and make automation safe."], ["8. AI Use Disclosure", "Dr. Gillespie used Claude Code to organize research and draft portions, and Grammarly for grammar and clarity, and verified all content himself."]], "refs": ["Anthropic. (2026). <i>Claude Code<\/i> [Large language model]. https://www.anthropic.com", "Boodle.ai. (2026). <i>BoodleBox<\/i>. https://box.boodle.ai", "Grammarly. (2026). <i>Grammarly<\/i> [Writing assistant]. https://www.grammarly.com", "Marr, B. (2025). <i>AI strategy<\/i>. Kogan Page.", "OpenAI. (2025). <i>GPT-5 mini<\/i> [Large language model]. https://developers.openai.com/api/docs/models/gpt-5-mini"]}, {"type": "Strategy Memo", "course": "MGT 6705 · Strategic Innovation & Leadership", "week": "Week 3", "date": "10/04/2026", "prof": "Dr. Ron C. Darnell", "title": "Managing Strategic Innovation at LEGO Group", "abstract": "Written as a memo to LEGO's senior marketing director, this memo looks at how an integrated innovation strategy can extend the company's turnaround. It applies Goffin and Mitchell's innovation framework and Tidd and Bessant's risk and reward lens, and recommends a $500,000 prototype program built on the Mindstorms co-creation model.", "keywords": "LEGO, innovation strategy, co-creation, Mindstorms, risk and reward", "sections": [["1. Purpose", "To show how integrated innovation strategy can drive LEGO Group's corporate turnaround and competitive advantage, using Goffin and Mitchell (2025) for strategy and Tidd and Bessant (2025) for risk and reward."], ["2. Organization and Environment", "LEGO is a global toy and entertainment company facing short product life cycles, intense competition and a newer digital front. Overdiversification and failed ventures in the early 2000s, including theme parks, took it near bankruptcy. The restructured strategy balances heritage with innovation and tighter governance (Robertson & Breen, 2013)."], ["3. Innovation Strategy", "Using Goffin and Mitchell's innovation pentathlon: ideas from the original portfolio and partners like Disney, Marvel and Star Wars; selection across kid and adult audiences; implementation on proven manufacturing with rapid prototyping; strategy built around getting the right product to the right market at the right time; and a people-and-culture foundation of hiring well and encouraging creativity."], ["4. Marketplace Adaptation", "The Mindstorms line showed the value of involving consumers in ideation, creation and development. Under non-disclosure agreements, their ideas and discoveries flow back to LEGO without making them employees. The recommendation: apply those practices to new products, starting with a modest $500,000 budget to put prototypes in front of prior play-partners."], ["5. Risk and Reward", "Risk: “digital is different” (Tidd & Bessant, 2025, p. 50), and Moore's Law means LEGO must keep current. Release digital concepts one at a time and watch the market response before major investment. Reward: co-creators and a social-network focus can lead to discrete innovation, and LEGO's online audience and retail stores are a ready test market."], ["6. Actionable Initiative", "Embrace the past while rewarding new ideas, selection, implementation and partnership. Mindstorms proved that outside collaboration can bring a new product to life and let it be iterated before mass production. The $500,000 early play-testing investment is the first step into digital."], ["7. AI Reflection", "Dr. Gillespie built the memo with NotebookLM, which hallucinated page numbers and references, gave no LEGO background, and missed the Mindstorms case study that Dr. Gillespie found in Goffin and Mitchell on his own. He found a definitive source for LEGO's history, used Claude to check APA 7, and Grammarly for spelling and structure."], ["8. Leadership Recommendation", "The memo's items tie closely to both textbooks. Applying those frameworks is how proven innovation strategy gets all the way to execution."]], "refs": ["Anthropic. (2026). <i>Claude (Opus 5.5 version)<\/i> [Large language model]. https://claude.ai", "Goffin, K., & Mitchell, R. (2025). <i>Innovation management: Effective strategy and implementation<\/i> (4th ed.). Bloomsbury Academic.", "Google. (2026). <i>NotebookLM<\/i> [Large language model]. https://notebooklm.google.com", "Grammarly. (2026). <i>Grammarly<\/i> [Writing assistant]. https://www.grammarly.com", "Robertson, D., & Breen, B. (2013). <i>Brick by brick: How LEGO rewrote the rules of innovation and conquered the global toy industry<\/i>. Crown Business.", "Tidd, J., & Bessant, J. (2025). <i>Managing innovation: Integrating technological, market and organizational change<\/i> (8th ed.). Wiley."]}, {"type": "Case Study", "course": "MGT 6705 · Strategic Innovation & Leadership", "week": "Week 4", "date": "10/10/2026", "prof": "Dr. Ron C. Darnell", "title": "Pixar: Culture, Leadership, and Future Innovation Challenges", "abstract": "Pixar built its animation tools before the internet era and turned them into films that broke the limits of computer technology. Drawing on Ed Catmull's Harvard Business Review article, this case study examines how Pixar's culture, teams and communication drive innovation, and why its postmortems matter most. Dr. Gillespie recommends two practices: the balanced postmortem and open communication without proper channels.", "keywords": "Pixar, organizational culture, postmortems, communication, leadership", "sections": [["1. Introduction and Background", "Pixar fostered creativity through computer-animation tools and software developed well before the internet became popular, then pivoted that technology into films that broke the technical limits of their time."], ["2. Innovation Culture", "Catmull (2008) argues that good ideas are not the limiting factor. His account of Pixar's success covers empowering creatives, a peer culture, freer communication, a learning environment, and getting more out of postmortems."], ["3. Role of Teams", "Giving creative people control of multiple stages of an idea's development makes teams cross-functional across directors, writers and storyboard artists (Catmull, 2008). Dr. Gillespie has worked at companies whose management skipped this and focused on bottom-line results, limiting creative ways to improve processes."], ["4. Leadership and Communication", "Pixar's teams solve complex problems without asking senior management for permission. Managers do not have to be first to know and can “walk into a meeting and be surprised” (Catmull, 2008, p. 70). Dr. Gillespie finds this refreshing, since that kind of openness is rarely tolerated in the organizations he has worked in."], ["5. Barriers to Innovation", "Teams often fear postmortems because they can expose individual or team performance. Pixar's version asks for both sides: the top five things to do again and the top five not to do again. Positive postmortem documentation is rare in IT management, and Dr. Gillespie applauds Pixar for making it normal."], ["6. Leadership Recommendation", "Tidd and Bessant (2025, p. 175) discuss “dark” leadership traits and innovation, and Dr. Gillespie has seen them in companies he has worked for. If a company focused on just two things, they should be the Pixar-style postmortem with both positives and improvements, and an open style of communication where proper channels fall away."], ["7. AI Reflection", "Dr. Gillespie used NotebookLM, which linked to paywalled sources. The free versions he found lacked page numbers, which made citing harder. Next time he plans to go back to Claude Code, which gave more reliable sources."]], "refs": ["Catmull, E. (2008). How Pixar fosters collective creativity. <i>Harvard Business Review, 86<\/i>(9), 64–72. https://hbr.org/2008/09/how-pixar-fosters-collective-creativity", "Google. (2026). <i>NotebookLM<\/i> [Large language model]. https://notebooklm.google.com", "Tidd, J., & Bessant, J. (2025). <i>Managing innovation: Integrating technological, market and organizational change<\/i> (8th ed.). Wiley."]}, {"type": "Case Study", "course": "MGT 6705 · Strategic Innovation & Leadership", "week": "Week 5", "date": "10/17/2026", "prof": "Dr. Ron C. Darnell", "title": "Sources of Innovation in the Semiconductor Industry", "abstract": "AI-driven demand for memory chips has produced shortages and price spikes that Dr. Gillespie's own team has had to absorb. This case study reflects on how the industry got here before proposing a fix, using design thinking and Tidd and Bessant's innovation search-space map. It locates the friction in silos, multi-vendor handoffs, and qualification delays, and points to industry partnership, in the style of IBM's open foundry model, as a way forward. It closes with a personal leadership lesson: step back before leaping to a solution.", "keywords": "semiconductors, AI demand, design thinking, sources of innovation, partnership", "sections": [["1. Introduction", "In Dr. Gillespie's industry, AI-driven demand for memory chips has caused shortages and price increases the team has had to bear. Industry watchers call it “RAMageddon.” Deloitte analysts (Kusters et al., 2026) say the squeeze could last until 2029 or 2030 if hyperscaler demand continues. The aim here is to find where innovation can reduce team communication friction: silos, multi-vendor gaps, and qualification delays."], ["2. Context", "Demand comes from consumers, who need memory for laptops and phones, and from service providers, who need it for the data centers that serve AI models. Both are growing at a scale not seen in recent times."], ["3. The Innovation Opportunity", "Following Estes (2025), Dr. Gillespie reflected on how the challenge arose before reaching for a solution. His own team saw the AI demand coming and did little to plan for the supply behind it. A refined NotebookLM prompt surfaced the three friction points above. Addressing them would carry both an opportunity and a cost that has to fit the company's budget."], ["4. Source of Innovation", "The primary force is the surge in AI demand, sitting on top of infrastructure constraints and slow handoffs. On Tidd and Bessant's (2025, p. 270) map, rising environmental complexity pushes an industry from exploiting what exists toward reframing its infrastructure, and from incremental toward radical change, which together create a co-evolution space. Dr. Gillespie reads the early PC era as exploitation with low demand and few competitive avenues. Today, pent-up demand and high prices are driving fierce competition among OpenAI, Google, Microsoft, Meta and others. He expects that competition to bring prices down eventually, after a volatile stretch."], ["5. Value Creation", "Organizations create value by offering fewer delays and faster qualification of new chip designs at a price consumers will pay. Lower communication barriers are how they get there."], ["6. From Idea to Initiative", "Partnership is one practical path. Many designs are proprietary, but limited resources can still be shared. IBM's foundry model lets competitors build on IBM's underused fabrication capacity, so both sides profit. Stakeholders should be identified and similar models explored to ease memory and chip prices in the mid to long term."], ["7. Design Thinking", "Reflect before solving: more research, industry collaboration, and other exercises come first (Estes, 2025, p. 25). The shortage is as much one of design and innovation thinking as one of product."], ["8. AI Reflection", "Dr. Gillespie used NotebookLM for research, found the first prompt weak, and refined it. He asked an AI assistant for one credible, independently verifiable source, then confirmed the Deloitte article himself. Claude helped identify that source and reviewed the paper against APA 7. Dr. Gillespie verified the source directly and approved every edit."], ["9. Leadership Lesson", "Dr. Gillespie has often relied on years of experience, seniority and influence to drive solutions without first stepping back to see the whole picture. He plans to practice the pause more and to encourage others to do the same."], ["10. Conclusion", "Starting with a solution may not be the best path. Removing barriers to communication and organizing ideas first should come before acting."]], "refs": ["Estes, R. (2025). <i>Design thinking: A guide to innovation<\/i>. Twenty-First Century Books.", "Kusters, J., Bhattacharjee, D., Ramachandran, K., & Stewart, D. (2026, July 28). Why memory chip crunch is greater than expected. <i>Deloitte Insights<\/i>.", "Tidd, J., & Bessant, J. (2025). <i>Managing innovation: Integrating technological, market and organizational change<\/i> (8th ed.). Wiley."]}], "value": {"headline": [{"v": "86%", "d": "of employers expect AI to transform their business by 2030", "s": "WEF Future of Jobs Report 2025", "url": "https://www.weforum.org/publications/the-future-of-jobs-report-2025/", "illus": false}, {"v": "72%", "d": "of organizations have adopted AI in at least one business function", "s": "McKinsey, The State of AI (2024)", "url": "https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai", "illus": false}, {"v": "Top 3", "d": "AI & big-data skills rank among the fastest-growing leaders need by 2030", "s": "WEF Future of Jobs Report 2025", "url": "https://www.weforum.org/publications/the-future-of-jobs-report-2025/", "illus": false}], "pillars": [{"key": "decision", "icon": "🧠", "title": "Sharper Decisions", "blurb": "Dr. Gillespie will turn data into decisions his team can stand behind."}, {"key": "efficiency", "icon": "⚙️", "title": "Less Busywork", "blurb": "Dr. Gillespie will find where AI takes friction out of the work and gives people time back."}, {"key": "strategy", "icon": "🎯", "title": "Clearer Direction", "blurb": "Dr. Gillespie will spot where AI gives a real advantage and help his organization get there."}, {"key": "productivity", "icon": "📈", "title": "A
